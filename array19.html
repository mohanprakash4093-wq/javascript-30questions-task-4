<body>

    <h2>Question 19: Rest Operator Sum</h2>

    <script>
        function one(a, b, ...c) {
            let sum = a + b + c[0] + c[1];

            console.log("Sum: " + sum);
            document.write("Sum: " + sum);
        }

        one(10, 20, 30, 40);
    </script>
