<!DOCTYPE html>
<html>
<head>
    <title>Array Question 4</title>
</head>
<body>
    <h2>Question 4: unshift()</h2>
    <p id="output"></p>

    <script>
        let numbers = [30, 40, 50, 60];

        numbers.unshift(10, 20);

        console.log(numbers);
        document.getElementById("output").innerHTML = numbers.join(", ");
    </script>
</body>
</html>
