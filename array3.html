<!DOCTYPE html>
<html>
<head>
    <title>Array Question 3</title>
</head>
<body>
    <h2>Question 3: shift()</h2>
    <p id="output"></p>

    <script>
        let names = ["Arun", "Bala", "Kumar", "Ravi", "Priya"];

        names.shift();

        console.log(names);
        document.getElementById("output").innerHTML = names.join(", ");
    </script>
</body>
</html>
