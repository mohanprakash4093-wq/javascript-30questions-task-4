<!DOCTYPE html>
<html>
<head>
    <title>Array Question 20</title>
</head>
<body>

    <h2>Question 20: Copy Array Using Spread Operator</h2>

    <script>
        let arr1 = [10, 20, 30, 40, 50];

        let arr2 = [...arr1];

        console.log("Original Array: " + arr1);
        console.log("Copied Array: " + arr2);

        document.write("Original Array: " + arr1 + "<br>");
        document.write("Copied Array: " + arr2);
    </script>

</body>
</html>
