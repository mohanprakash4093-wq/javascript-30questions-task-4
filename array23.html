<!DOCTYPE html>
<html>
<head>
    <title>Array Question 23</title>
</head>
<body>

    <h2>Question 23: Student Details</h2>

    <script>
        let student = ["Mohan", 21, 8.5];

        let [name, age, cgpa] = student;

        console.log("Name: " + name);
        console.log("Age: " + age);
        console.log("CGPA: " + cgpa);

        document.write("Name: " + name + "<br>");
        document.write("Age: " + age + "<br>");
        document.write("CGPA: " + cgpa);
    </script>

</body>
</html>
