<!DOCTYPE html>
<html>
<head>
    <title>Array Question 18</title>
</head>
<body>

    <h2>Question 18: Rest Operator</h2>

    <script>
        function displayNumbers(a, b, ...rest) {
            console.log("First number: " + a);
            console.log("Second number: " + b);
            console.log("Remaining numbers: " + rest);

            document.write("First number: " + a + "<br>");
            document.write("Second number: " + b + "<br>");
            document.write("Remaining numbers: " + rest);
        }

        displayNumbers(10, 20, 30, 40, 50);
    </script>

</body>
</html>
