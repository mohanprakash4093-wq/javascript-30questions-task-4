<!DOCTYPE html>
<html>
<head>
    <title>Array Question 21</title>
</head>
<body>

    <h2>Question 21: Array Destructuring</h2>

    <script>
        let arr = [10, 20, 30, 40];

        let [a, b, c, d] = arr;

        console.log("a = " + a);
        console.log("b = " + b);
        console.log("c = " + c);
        console.log("d = " + d);

        document.write("a = " + a + "<br>");
        document.write("b = " + b + "<br>");
        document.write("c = " + c + "<br>");
        document.write("d = " + d);
    </script>

</body>
</html>
