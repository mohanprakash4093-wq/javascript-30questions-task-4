<!DOCTYPE html>
<html>
<head>
    <title>Array Question 5</title>
</head>
<body>
    <h2>Question 5: splice()</h2>
    <p id="output"></p>

    <script>
        let arr = [10, 20, 30, 40, 50];

        arr.splice(1, 2);

        console.log(arr);
        document.getElementById("output").innerHTML = arr.join(", ");
    </script>
</body>
</html>
