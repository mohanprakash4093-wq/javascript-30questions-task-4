<!DOCTYPE html>
<html>
<head>
    <title>Array Question 2</title>
</head>
<body>
    <h2>Question 2: pop()</h2>
    <p id="output"></p>

    <script>
        let numbers = [10, 20, 30, 40, 50, 60];

        numbers.pop();

        console.log(numbers);
        document.getElementById("output").innerHTML = numbers.join(", ");
    </script>
</body>
</html>
