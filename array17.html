<!DOCTYPE html>
<html>
<head>
    <title>Array Question 17</title>
</head>
<body>

    <h2>Question 17: Merge Objects</h2>

    <script>
        let student = {
            name: "Mohan",
            age: 21,
            cgpa: 8.5
        };

        let job = {
            role: "Software Developer",
            company: "ABC Company"
        };

        let result = { ...student, ...job };

        console.log(result);
        document.write(JSON.stringify(result));
    </script>

</body>
</html>
