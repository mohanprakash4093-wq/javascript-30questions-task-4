<!DOCTYPE html>
<html>
<head>
    <title>Array Question 9</title>
</head>
<body>
    <h2>Question 9: slice()</h2>
    <p id="output"></p>

    <script>
        let arr = [10, 20, 30, 40, 50, 60];

        let result = arr.slice(1, 4);

        console.log(result);
        document.getElementById("output").innerHTML = result.join(", ");
    </script>
</body>
</html>
