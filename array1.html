<!DOCTYPE html>
<html>
<head>
    <title>Array Question 1</title>
</head>
<body>
    <h2>Question 1: push()</h2>
    <p id="output"></p>

    <script>
        let fruits = ["Apple", "Banana", "Mango", "Orange", "Grapes"];

        fruits.push("Pineapple", "Papaya", "Watermelon");

        console.log(fruits);
        document.getElementById("output").innerHTML = fruits.join(", ");
    </script>
</body>
</html>
