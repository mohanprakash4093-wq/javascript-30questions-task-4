<!DOCTYPE html>
<html>
<head>
    <title>Array Question 8</title>
</head>
<body>
    <h2>Question 8: concat()</h2>
    <p id="output"></p>

    <script>
        let arr1 = [10, 20, 30];
        let arr2 = [40, 50, 60];

        let result = arr1.concat(arr2);

        console.log(result);
        document.getElementById("output").innerHTML = result.join(", ");
    </script>
</body>
</html>
