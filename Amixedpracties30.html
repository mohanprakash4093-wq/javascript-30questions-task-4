<!DOCTYPE html>
<html>
<head>
    <title>Array Question 30</title>
</head>
<body>

    <h2>Question 30: Flatten and Reverse Array</h2>

    <p id="output"></p>

    <script>
        let arr = [1, [2, 3], [4, [5, 6]], 7];

        let result = arr.flat(Infinity);

        result.reverse();

        console.log("Final Array: ", result);

        document.getElementById("output").innerHTML =
            "Final Array: " + result.join(", ");
    </script>

</body>
</html>
