<!DOCTYPE html>
<html>
<head>
    <title>Array Question 28</title>
</head>
<body>

    <h2>Question 28: Array Search Methods</h2>

    <p id="output"></p>

    <script>
        let arr = [10, 20, 30, 20, 40, 20, 50];

        let number = 20;

        let exists = arr.includes(number);
        let firstIndex = arr.indexOf(number);
        let lastIndex = arr.lastIndexOf(number);

        console.log("Array: " + arr);
        console.log("Includes 20: " + exists);
        console.log("First Index of 20: " + firstIndex);
        console.log("Last Index of 20: " + lastIndex);

        document.getElementById("output").innerHTML =
            "Array: " + arr.join(", ") + "<br>" +
            "Includes 20: " + exists + "<br>" +
            "First Index of 20: " + firstIndex + "<br>" +
            "Last Index of 20: " + lastIndex;
    </script>

</body>
</html>
